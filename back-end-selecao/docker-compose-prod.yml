version: "3.8"

services:
  # --- Banco de Dados ---
  db_postgres:
    image: postgres:16-alpine
    container_name: db_${APP_CONTAINER_NAME}
    restart: always
    env_file: .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      backend_network:
        aliases:
          - db_postgres
          - db_${APP_CONTAINER_NAME}
      selecao_global:
        aliases:
          - db_postgres
          - db_${APP_CONTAINER_NAME}

  # --- Redis ---
  # Alias redis_${APP_CONTAINER_NAME} na rede externa: mesmo host que o app usa no .env
  # quando backend_network do projeto não é a mesma instância entre serviços.
  # Redis: cache, OTP e result backend do Celery. Broker = RabbitMQ.
  redis:
    image: redis:alpine
    container_name: redis_${APP_CONTAINER_NAME}
    restart: always
    networks:
      backend_network:
        aliases:
          - redis
      selecao_global:
        aliases:
          - redis_${APP_CONTAINER_NAME}

  # --- RabbitMQ (broker Celery) ---
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_${APP_CONTAINER_NAME}
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-selecao}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-selecao}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      backend_network:
        aliases:
          - rabbitmq

  # --- Celery Worker ---
  celery_worker:
    container_name: celery_worker_${APP_CONTAINER_NAME}
    image: ${BACKEND_IMAGE:-back-end-selecao:latest}
    build:
      context: .
    restart: always
    volumes:
      - .:/home/app/django
    env_file: .env
    environment:
      # Hostnames do Compose (não usar db_postgres fora da rede Docker)
      DB_HOST: db_postgres
      DB_PORT: "5432"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://selecao:selecao@rabbitmq:5672//}
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
    command: celery -A core worker -Q celery,sms --loglevel=info
    networks:
      - backend_network
    depends_on:
      db_postgres:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # --- Celery Beat ---
  celery_beat:
    container_name: celery_beat_${APP_CONTAINER_NAME}
    image: ${BACKEND_IMAGE:-back-end-selecao:latest}
    build:
      context: .
    restart: always
    volumes:
      - .:/home/app/django
      - ./staticfiles:/home/app/django/staticfiles
      - ./media:/home/app/django/media
    env_file: .env
    environment:
      DB_HOST: db_postgres
      DB_PORT: "5432"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://selecao:selecao@rabbitmq:5672//}
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
    command: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    networks:
      - backend_network
    depends_on:
      db_postgres:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      celery_worker:
        condition: service_started

  # --- Aplicação Django com Gunicorn ---
  app:
    container_name: app_${APP_CONTAINER_NAME}
    image: ${BACKEND_IMAGE:-back-end-selecao:latest}
    build: .
    restart: "no"
    volumes:
      - .:/home/app/django
      - ./staticfiles:/home/app/django/staticfiles
      - ./media:/home/app/django/media
    env_file: .env
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://selecao:selecao@rabbitmq:5672//}
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn core.wsgi:application --bind 0.0.0.0:${APP_INTERNAL_PORT}
      "
    networks:
      - backend_network
      - selecao_global
    depends_on:
      db_postgres:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "8012:${APP_INTERNAL_PORT}" # Porta EXTERNA do app (tabela oficial)

networks:
  backend_network:
    driver: bridge

  selecao_global:
    external: true
    name: selecao_backend_global_proxy

volumes:
  postgres_data:
  rabbitmq_data:

version: '3.8'

services:
  # --- PostgreSQL Selecao Local ---
  db_postgres:
    image: postgres:16-alpine
    container_name: db_selecao-local
    restart: always
    environment:
      # Isolado do .env de prod: volume local foi criado com estes valores.
      POSTGRES_DB: selecao-local_db
      POSTGRES_USER: selecao-local_user
      POSTGRES_PASSWORD: selecao-local_pass
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "15436:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    networks:
      - backend_network

  # --- Redis selecaoLocal (cache, OTP, result backend) ---
  redis:
    image: redis:alpine
    container_name: redis_selecao-local
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      backend_network:
        aliases:
          - redis
          - redis_selecao_system

  # --- RabbitMQ (broker Celery) ---
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_selecao-local
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-selecao}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-selecao}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      backend_network:
        aliases:
          - rabbitmq

  # --- Django selecao-Local ---
# AVISO: defaults abaixo são SOMENTE para lab local. Nunca reutilize este compose em staging/prod.
  app:
    container_name: app_selecao-local
    build:
      context: .
    restart: always
    volumes:
      - .:/home/app/django
      - ./staticfiles:/home/app/django/staticfiles
      - ./media:/home/app/django/media
    environment:
      DJANGO_selecao-LOCAL_STATIC: "1"
      DEBUG: "1"
      SECRET_KEY: selecao-local-secret-key
      DB_NAME: selecao-local_db
      DB_USER: selecao-local_user
      DB_PASSWORD: selecao-local_pass
      DB_HOST: db_postgres
      DB_PORT: 5432
      ALLOWED_HOSTS: "localhost,127.0.0.1,app_selecao-local,selecao-localhost"
      HOST_BASE_URL: "localhost:8000"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://selecao:selecao@rabbitmq:5672//}
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      SMS_DEBUG_EXPOSE_ERRORS: ${SMS_DEBUG_EXPOSE_ERRORS:-false}
      ISEND_TOKEN: ${ISEND_TOKEN:-}
      ISEND_USERNAME: ${ISEND_USERNAME:-}
      ISEND_PASSWORD: ${ISEND_PASSWORD:-}
      ISEND_WSDL: ${ISEND_WSDL:-http://www2.isend.com.br/SendWSImplService/SendWSImpl?wsdl}
      ISEND_AUTH_WSDL: ${ISEND_AUTH_WSDL:-http://www2.isend.com.br/iSend/ws/PartnerSendIntegrationWs?wsdl}
      ISEND_TOKEN_TTL: "43200"
      SMS_VERIFICATION_TTL: "300"
      SMS_VERIFICATION_RESEND_COOLDOWN: "60"
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    networks:
      - backend_network
    depends_on:
      db_postgres:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # --- Celery Worker Local ---
  celery_worker:
    container_name: celery_worker_selecao-local
    build:
      context: .
    restart: always
    volumes:
      - .:/home/app/django
      - ./logs:/home/app/django/logs
    environment:
      DB_NAME: selecao-local_db
      DB_USER: selecao-local_user
      DB_PASSWORD: selecao-local_pass
      DB_HOST: db_postgres
      DB_PORT: 5432
      SECRET_KEY: selecao-local-secret-key
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://selecao:selecao@rabbitmq:5672//}
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      SMS_DEBUG_EXPOSE_ERRORS: ${SMS_DEBUG_EXPOSE_ERRORS:-false}
      ISEND_TOKEN: ${ISEND_TOKEN:-}
      ISEND_USERNAME: ${ISEND_USERNAME:-}
      ISEND_PASSWORD: ${ISEND_PASSWORD:-}
      ISEND_WSDL: ${ISEND_WSDL:-http://www2.isend.com.br/SendWSImplService/SendWSImpl?wsdl}
      ISEND_AUTH_WSDL: ${ISEND_AUTH_WSDL:-http://www2.isend.com.br/iSend/ws/PartnerSendIntegrationWs?wsdl}
      ISEND_TOKEN_TTL: "43200"
      SMS_VERIFICATION_TTL: "300"
      DEBUG: "1"
    command: celery -A core worker -Q celery,sms --loglevel=info
    networks:
      - backend_network
    depends_on:
      db_postgres:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      app:
        condition: service_started

  # --- Celery Beat selecao-Local ---
  celery_beat:
    container_name: celery_beat_selecao-local
    build:
      context: .
    restart: always
    volumes:
      - .:/home/app/django
      - ./logs:/home/app/django/logs
    environment:
      DB_NAME: selecao-local_db
      DB_USER: selecao-local_user
      DB_PASSWORD: selecao-local_pass
      DB_HOST: db_postgres
      DB_PORT: 5432
      SECRET_KEY: selecao-local-secret-key
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://selecao:selecao@rabbitmq:5672//}
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEBUG: "1"
    command: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    networks:
      - backend_network
    depends_on:
      db_postgres:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      app:
        condition: service_started
      celery_worker:
        condition: service_started

networks:
  backend_network:
    driver: bridge

volumes:
  postgres_local_data:
  redis_data:
  rabbitmq_data:

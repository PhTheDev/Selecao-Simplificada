# Ambiente de desenvolvimento completo: front + API + worker + banco + filas.
#   docker compose -f docker-compose.dev.yml up --build
# Front:      http://localhost:3000
# API:        http://localhost:8000   (admin em /admin)
# RabbitMQ:   http://localhost:15672  (selecao / selecao)
# AVISO: credenciais abaixo são SOMENTE para uso local. Nunca use este arquivo em staging/prod.

x-django-env: &django-env
  DEBUG: "1"
  SECRET_KEY: selecao-local-secret-key
  DB_NAME: selecao-local_db
  DB_USER: selecao-local_user
  DB_PASSWORD: selecao-local_pass
  DB_HOST: db_postgres
  DB_PORT: 5432
  ALLOWED_HOSTS: "localhost,127.0.0.1,app"
  HOST_BASE_URL: "localhost:8000"
  CELERY_BROKER_URL: amqp://selecao:selecao@rabbitmq:5672//
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  CACHE_URL: redis://redis:6379/1
  # email: código de recuperação de senha sai no log do worker; use "smtp" + EMAIL_* para e-mail real
  SMS_PROVIDER: ${SMS_PROVIDER:-email}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-localhost}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@selecao.local}
  SMS_VERIFICATION_TTL: "300"
  SMS_VERIFICATION_RESEND_COOLDOWN: "60"

x-django-service: &django-service
  build:
    context: ./back-end-selecao
  restart: unless-stopped
  environment: *django-env
  networks:
    - dev_network

services:
  db_postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: selecao-local_db
      POSTGRES_USER: selecao-local_user
      POSTGRES_PASSWORD: selecao-local_pass
    ports:
      - "15436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selecao-local_user -d selecao-local_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dev_network

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dev_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: selecao
      RABBITMQ_DEFAULT_PASS: selecao
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dev_network

  app:
    <<: *django-service
    volumes:
      - ./back-end-selecao:/home/app/django
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  celery_worker:
    <<: *django-service
    volumes:
      - ./back-end-selecao:/home/app/django
    command: celery -A core worker -Q celery,sms --loglevel=info
    depends_on:
      app:
        condition: service_started

  celery_beat:
    <<: *django-service
    volumes:
      - ./back-end-selecao:/home/app/django
    command: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      app:
        condition: service_started

  frontend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    # node_modules fica em volume próprio para não misturar com o do Windows/host
    volumes:
      - ./front-end-selecao:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_DJANGO_API_URL: http://localhost:8000
      DJANGO_INTERNAL_ORIGIN: http://app:8000
      WATCHPACK_POLLING: "true"
    command: sh -c "npm ci && npm run dev -- -H 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    depends_on:
      - app
    networks:
      - dev_network

networks:
  dev_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  frontend_node_modules:

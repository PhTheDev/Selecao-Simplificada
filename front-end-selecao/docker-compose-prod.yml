services:
  next-app:
    container_name: app_selecao_frontend
    image: ${FRONTEND_IMAGE:-frontend-selecao:latest}
    build:
      context: .
      args:
        NEXT_PUBLIC_DJANGO_API_URL: ${NEXT_PUBLIC_DJANGO_API_URL:-http://localhost:3000}
        DJANGO_INTERNAL_ORIGIN: ${DJANGO_INTERNAL_ORIGIN:-http://app_selecao_system:8000}
    restart: always
    ports:
      - "3002:3002"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3002
      - HOSTNAME=0.0.0.0
      - DJANGO_INTERNAL_ORIGIN=${DJANGO_INTERNAL_ORIGIN:-http://app_selecao_system:8000}
    networks:
      - selecao_global
      - selecao_backend

networks:
  selecao_global:
    external: true
    name: selecao_frontend_global_proxy
  selecao_backend:
    external: true
    name: selecao_backend_global_proxy
